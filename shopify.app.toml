# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f81598b8bf15bfdd4165afb29ef957c4"
application_url = "https://fs-custom-badges.vercel.app"
embedded = true
name = "fs-custom-badges"

[app_proxy]
url = "https://shopify.dev"
subpath = "badges"
prefix = "apps"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_products"

[auth]
redirect_urls = [
  "https://fs-custom-badges.vercel.app/auth/callback",
  "https://fs-custom-badges.vercel.app/auth/shopify/callback",
  "https://fs-custom-badges.vercel.app/api/auth"
]

[build]
automatically_update_urls_on_dev = true
